name: Build & Sign Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Rust & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        working-directory: app
        run: bun install

      - name: Init Android Project
        working-directory: app
        run: bunx tauri android init --ci

      - name: Build Android APK
        working-directory: app
        run: bunx tauri android build --apk

      # --- Prüfen, ob Signierungs-Secret existiert ---
      - name: Check Keystore Secret
        id: check_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "is_signed=true" >> $GITHUB_OUTPUT
          else
            echo "is_signed=false" >> $GITHUB_OUTPUT
          fi

      # --- APK Signierung ---
      - name: Decode Keystore
        if: steps.check_keystore.outputs.is_signed == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Sign APK
        if: steps.check_keystore.outputs.is_signed == 'true'
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          APK_PATH=$(find app/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks app/release.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --out app/app-release-signed.apk \
            "$APK_PATH"

      # --- Artefakt hochladen ---
      - name: Upload Signed APK
        if: steps.check_keystore.outputs.is_signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/app-release-signed.apk

      - name: Upload Unsigned APK (Fallback)
        if: steps.check_keystore.outputs.is_signed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: |
            app/**/gen/android/app/build/outputs/apk/universal/release/*.apk
            app/**/gen/android/app/build/outputs/apk/arm64/release/*.apk
