name: Build iOS IPA (Tauri v2)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    defaults:
      run:
        working-directory: app

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust Toolchain & iOS Target installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust Cache aktivieren
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Dependencies installieren
        run: bun install --frozen-lockfile

      - name: Frontend Assets bauen
        run: bun run build

      - name: Tauri iOS Projekt initialisieren
        run: bunx tauri ios init

      - name: Code Signing im Xcode-Projekt erzwingend deaktivieren
        run: |
          PBXPROJ=$(find src-tauri/gen/apple -name "project.pbxproj")
          
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          sed -i '' 's/buildSettings = {/buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"

      - name: iOS App direkt mit xcodebuild kompilieren
        run: |
          cd src-tauri/gen/apple
          XCODE_PROJ=$(ls -d *.xcodeproj | head -n 1)
          SCHEME=$(xcodebuild -list -project "$XCODE_PROJ" | grep -E '_iOS$' | head -n 1 | xargs)
          
          xcodebuild -project "$XCODE_PROJ" \
                    -scheme "$SCHEME" \
                    -configuration Release \
                    -sdk iphoneos \
                    -derivedDataPath build \
                    CODE_SIGNING_ALLOWED=NO \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGN_IDENTITY=""

      - name: Unsigned IPA paketieren
        run: |
          mkdir -p Payload
          cp -r src-tauri/gen/apple/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r App.ipa Payload
          rm -rf Payload

      - name: IPA als GitHub Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-ios
          path: app/App.ipa
          retention-days: 7
