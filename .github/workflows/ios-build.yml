name: Build iOS IPA (Tauri v2)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    defaults:
      run:
        working-directory: app

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Rust Toolchain & iOS Target installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust Cache aktivieren
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Dependencies installieren
        run: bun install --frozen-lockfile

      - name: Tauri iOS Projekt initialisieren
        run: bunx tauri ios init

      - name: Code Signing im Xcode-Projekt deaktivieren
        run: |
          python3 -c '
          import glob, re
          for f in glob.glob("src-tauri/gen/apple/**/*.pbxproj", recursive=True):
              with open(f, "r") as file:
                  content = file.read()
              content = re.sub(r"CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;", content)
              content = re.sub(r"DEVELOPMENT_TEAM = [^;]*;", "DEVELOPMENT_TEAM = \"\";", content)
              content = re.sub(r"buildSettings = \{", "buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";", content)
              with open(f, "w") as file:
                  file.write(content)
          '

      - name: Tauri iOS App bauen
        env:
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGN_IDENTITY: ""
          DEVELOPMENT_TEAM: ""
        run: |
          bunx tauri ios build

      - name: Unsigned IPA paketieren
        run: |
          mkdir -p Payload
          # Dynamische Suche nach der .app Datei im DerivedData-Ordner von Xcode
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | grep "release-iphoneos" | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Fehler: Keine .app Datei gefunden!"
            exit 1
          fi
          
          echo "Verwende App unter: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r App.ipa Payload
          rm -rf Payload

      - name: IPA als GitHub Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: tauri-app-ios
          path: app/App.ipa
          retention-days: 7
