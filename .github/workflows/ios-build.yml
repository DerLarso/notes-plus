name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Bun installieren
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Rust Toolchain & iOS Target einrichten
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cargo Binaries global verlinken (für Xcode-Skripte)
        run: |
          sudo mkdir -p /usr/local/bin
          sudo ln -sf $HOME/.cargo/bin/* /usr/local/bin/ || true

      - name: Abhängigkeiten installieren
        working-directory: ./app
        run: bun install

      - name: Web Frontend bauen & iOS Projekt initialisieren
        working-directory: ./app
        run: |
          bun run build
          bunx tauri ios init

      - name: Code Signing im Xcode-Projekt deaktivieren
        run: |
          python3 -c '
          import glob, re
          for f in glob.glob("**/gen/apple/**/*.pbxproj", recursive=True):
              with open(f, "r") as file:
                  content = file.read()
              content = re.sub(r"CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;", content)
              content = re.sub(r"DEVELOPMENT_TEAM = [^;]*;", "DEVELOPMENT_TEAM = \"\";", content)
              content = re.sub(r"buildSettings = \{", "buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n\t\t\t\tCODE_SIGN_IDENTITY = \"\";", content)
              with open(f, "w") as file:
                  file.write(content)
          '

      - name: iOS App bauen (ohne exportArchive)
        run: |
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/build/*" | head -n 1)
          
          if [ -z "$WORKSPACE" ]; then
            echo "Fehler: Keine .xcworkspace gefunden!"
            exit 1
          fi

          echo "Gefundener Workspace: $WORKSPACE"

          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list | grep -A 10 "Schemes:" | tail -n +2 | xargs | awk '{print $1}')
          echo "Verwende Scheme: $SCHEME"

          PATH="$HOME/.cargo/bin:$PATH" xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Unsigned IPA paketieren
        run: |
          mkdir -p Payload
          
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Fehler: Keine .app Datei im Build-Ordner gefunden!"
            exit 1
          fi
          
          echo "Verwende App unter: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r App.ipa Payload
          rm -rf Payload

      - name: IPA als GitHub Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rednotes-plus-ios-unsigned
          path: App.ipa
          retention-days: 7
